      - company: HKUST (GZ)
        position: Research on LLM Uncertainty and Embodied AI
        start_date: 2025-08
        end_date: 2026-04
        summary: Collaborated with Prof. Sihong Xie.
        highlights:
          - Investigated uncertainty in large language models, focusing on internal knowledge-flow pathways.
          - A paper on uncertainty in model question answering was accepted as an oral presentation at ICML 2026.
          - A paper on scene graph generation was accepted at ECCV 2026.

      - company: Tsinghua University, Institute for AI Industry Research (AIR)
        position: Research on Computer Vision
        start_date: 2024-12
        end_date: 2025-04
        summary: Collaborated with Prof. Hao Zhao.
        highlights:
          - Proposed YOTO based on YOLO, maintaining YOLO's speed while achieving mean average precision close to the state of the art.
          - Developed YOTO as a highly deployable, high-speed, and lightweight model for task-oriented detection.
          - Introduced a distillation framework and integrated a text encoder to unify task-oriented detection and object detection through text prompts.
          - Improved the use of pretrained object-detection models and addressed the limited diversity of task-oriented datasets.

      - company: The State Key Laboratory of Automotive Simulation and Control (ASCL)
        position: Research on Intelligent Cockpit Technology
        start_date: 2023-10
        end_date: 2024-12
        summary: Collaborated with Prof. Rui Zhao and Prof. Fei Gao.
        highlights:
          - Developed a data-driven framework for digital modeling and recognition of human-vehicle cabin interaction scenarios using large-scale driving-behavior data.
          - Constructed a large-scale interaction dataset and fine-tuned an intent-prediction model with LoRA, achieving high-precision recognition and strong generalization. This first-authored work was published in Sensors.
          - Developed a reinforcement-learning framework combining offline expert-guided pretraining with online Twin Delayed Deep Deterministic Policy Gradient (TD3) in a dual-layer optimization architecture.
          - Achieved centimeter-level path-tracking accuracy while optimizing passenger comfort. This second-authored work was published in Sensors.

